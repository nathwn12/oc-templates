name: docs-report

on:
  pull_request:

jobs:
  docs-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: docs gate (report-only, phase 1)
        run: node docs-check.mjs --report
      - name: link check (offline, report-only, phase 1)
        uses: lycheeverse/lychee-action@v2.2.0
        with:
          args: --offline --no-progress --verbose '**/*.md'
          fail: false
