name: supply-chain

# Free-tier GitHub-hosted check on a public repository.
on:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install from the lockfile
        run: npm ci
      # picomatch 4.0.7 is the newest published release and GHSA-fc5q-39xc-vjpf
      # covers <=4.0.7, so no patched version exists. It reaches this tree via
      # @opencode/plugin > @opencode/util > @npmcli/arborist > node-gyp >
      # tinyglobby > fdir|picomatch. The gate tolerates exactly that chain and
      # still fails on any other high or critical advisory. Remove it when a
      # newer picomatch ships.
      - name: Audit dependencies
        run: |
          npm audit --json > audit.json || true
          node -e '
            const report = require("./audit.json");
            const allowed = new Set(["picomatch", "fdir", "tinyglobby", "node-gyp", "@npmcli/run-script"]);
            const blockers = Object.entries(report.vulnerabilities || {})
              .filter(([name, v]) => ["high", "critical"].includes(v.severity) && !allowed.has(name));
            if (blockers.length > 0) {
              for (const [name, v] of blockers) console.error(`${v.severity}: ${name}`);
              process.exit(1);
            }
            console.error("audit: only the unfixable picomatch chain is present");
          '
